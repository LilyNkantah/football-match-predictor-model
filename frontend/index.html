<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Match Predictor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" 
  integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>

  <div class="container py-4">

    <h1 class="mb-4">Football Match Predictor</h1>

    <!-- Model Stats strip: global model performance, doesn't change with season selector -->
    <div class="row mb-4 g-3">
      <div class="col-6 col-md-3">
        <div class="border rounded p-3">
          <div class="text-muted small">Overall accuracy</div>
          <div class="fs-4">50%</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="border rounded p-3">
          <div class="text-muted small">Vs random baseline</div>
          <div class="fs-4">33%</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="border rounded p-3">
          <div class="text-muted small">Strongest class</div>
          <div class="fs-4">Home wins</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="border rounded p-3">
          <div class="text-muted small">Weakest class</div>
          <div class="fs-4">Draws</div>
        </div>
      </div>
    </div>

    <!-- Season selector: affects which set of fixtures the table below shows -->
    <div class="mb-3" style="max-width: 220px;">
      <select id="season-selection" class="form-select">
        <option value="1">2022/23 season</option>
        <option value="2">2023/24 season</option>
        <option value="3">2024/25 season</option>
      </select>
    </div>

    <!-- Fixture table -->
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Fixture</th>
          <th>Actual</th>
          <th>Predicted</th>
          <th></th>
          <th class="text-end">Explanation</th>
        </tr>
      </thead>
      <tbody id="fixture-table-body">
        <!-- Rows will be inserted here by JavaScript -->
      </tbody>
    </table>

    <!-- Pagination -->
    <nav aria-label="Fixture pagination">
      <ul class="pagination justify-content-center" id="pagination-controls">
        <!-- Page items will be inserted here by JavaScript -->
      </ul>
    </nav>

    <!-- Explain panel: hidden until a row's Explain button is clicked -->
    <div id="explain-panel" class="border rounded p-3 mt-3 d-none">
      <div id="explain-content"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
